<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="350" viewBox="0 0 1100 350"><rect width="100%" height="100%" fill="white"/><text x="50" y="55" font-family="Arial" font-size="28" font-weight="700">A detector output is not a regime claim</text><text x="50" y="90" font-family="Arial" font-size="17">RRC audits what the output is licensed to assert under the stated protocol.</text><rect x="60" y="135" width="280" height="120" rx="16" fill="#f5f5f5" stroke="#333" stroke-width="2"/><text x="80" y="175" font-family="Arial" font-size="21" font-weight="700">Detector output</text><text x="80" y="210" font-family="Arial" font-size="15">“two regimes”</text><text x="80" y="232" font-family="Arial" font-size="15">switch</text><text x="80" y="254" font-family="Arial" font-size="15">break</text><rect x="390" y="135" width="280" height="120" rx="16" fill="#f5f5f5" stroke="#333" stroke-width="2"/><text x="410" y="175" font-family="Arial" font-size="21" font-weight="700">RRC audit</text><text x="410" y="210" font-family="Arial" font-size="15">protocol + support + persistence + selection + guards</text><rect x="760" y="135" width="280" height="120" rx="16" fill="#f5f5f5" stroke="#333" stroke-width="2"/><text x="780" y="175" font-family="Arial" font-size="21" font-weight="700">Licensed claim</text><text x="780" y="210" font-family="Arial" font-size="15">identified</text><text x="780" y="232" font-family="Arial" font-size="15">hidden</text><text x="780" y="254" font-family="Arial" font-size="15">phantom</text><text x="780" y="276" font-family="Arial" font-size="15">not identifiable</text><path d="M340 195 L385 195" stroke="#333" stroke-width="3" marker-end="url(#a)"/><path d="M670 195 L755 195" stroke="#333" stroke-width="3" marker-end="url(#a)"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#333"/></marker></defs><text x="50" y="315" font-family="Arial" font-size="15">Readability is one field. Generator support, persistence, and selection are separate fields.</text></svg>